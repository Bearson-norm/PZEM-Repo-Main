services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: pzem_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5412:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=pzem_monitoring
      - DB_USER=postgres
      - DB_PASS=Admin123
      - PLN_TARIFF_CLASS=B2
      - PLN_CONTRACTED_VA=53000
      - PLN_PPN_PERCENT=0.11
    volumes:
      - ./dashboard:/app
      - ./shared:/app/shared
      - reports_data:/app/reports
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  mqtt-listener:
    build:
      context: .
      dockerfile: mqtt/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=pzem_monitoring
      - DB_USER=postgres
      - DB_PASS=Admin123
    volumes:
      - ./mqtt:/app
      - ./shared:/app/shared

volumes:
  pgdata:
  reports_data:
