services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pzem_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5412:5432"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=pzem_monitoring
      - DB_USER=postgres
      - DB_PASS=Admin123
      - PLN_TARIFF_CLASS=B2
      - PLN_CONTRACTED_VA=53000
      - PLN_PPN_PERCENT=0.11
    volumes:
      - ./dashboard:/app
      - ./shared:/app/shared
      - reports_data:/app/reports
    # Prevent OOM kill - reserve memory for dashboard
    mem_limit: 512m
    mem_reservation: 256m

  mqtt-listener:
    build:
      context: .
      dockerfile: mqtt/Dockerfile
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=pzem_monitoring
      - DB_USER=postgres
      - DB_PASS=Admin123
    volumes:
      - ./mqtt:/app
      - ./shared:/app/shared

volumes:
  pgdata:
  reports_data:
