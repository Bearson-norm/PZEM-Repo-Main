name: CD - Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_DEPLOY_DIR: /opt/pzem-monitoring
  DOMAIN: pzem.moof-set.web.id

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Create deployment package
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        PACKAGE_NAME="pzem-monitoring-deploy-${TIMESTAMP}.tar.gz"
        
        # Create package
        tar -czf ${PACKAGE_NAME} \
          dashboard/ \
          mqtt/ \
          shared/ \
          docker-compose.yml \
          start.sh \
          nginx-pzem.conf \
          setup-nginx-ssl.sh \
          QUICK_FIX_502.sh \
          fix-nginx-502.sh \
          recover-pzem-vps.sh \
          deploy-vps-ci.sh \
          *.md \
          .github/
        
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "Package created: ${PACKAGE_NAME}"

    - name: Upload package to VPS
      run: |
        scp -o StrictHostKeyChecking=no ${PACKAGE_NAME} ${VPS_USER}@${VPS_HOST}:/tmp/
        echo "Package uploaded to VPS"

    - name: Upload deploy script to VPS
      run: |
        scp -o StrictHostKeyChecking=no deploy-vps-ci.sh ${VPS_USER}@${VPS_HOST}:/tmp/deploy-vps-ci.sh

    - name: Execute deployment on VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} \
          "chmod +x /tmp/deploy-vps-ci.sh && bash /tmp/deploy-vps-ci.sh /tmp/${PACKAGE_NAME}"

    - name: Verify deployment (backend + domain)
      run: |
        ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} << 'EOF'
          set -e
          cd /opt/pzem-monitoring
          docker compose ps || docker-compose ps
          echo ""
          echo "Backend:"
          curl -fsS http://127.0.0.1:5000/health/live && echo " ✅ /health/live"
          curl -fsS -o /dev/null -w "HTTPS domain: %{http_code}\n" \
            --max-time 15 https://pzem.moof-set.web.id/health/live || echo " ⚠️ HTTPS check failed"
        EOF

    - name: Cleanup local files
      if: always()
      run: |
        rm -f ${PACKAGE_NAME}

    - name: Deployment summary
      if: always()
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **VPS**: ${VPS_USER}@${VPS_HOST}" >> $GITHUB_STEP_SUMMARY
        echo "- **Domain**: ${DOMAIN}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
        echo "- Dashboard: http://${VPS_HOST}:5000" >> $GITHUB_STEP_SUMMARY
        echo "- Domain: https://${DOMAIN}" >> $GITHUB_STEP_SUMMARY
        echo "- Health: http://${VPS_HOST}:5000/health" >> $GITHUB_STEP_SUMMARY

