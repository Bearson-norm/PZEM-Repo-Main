name: CI - Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Mirror resmi Docker Hub — lebih stabil dari runner GitHub Actions daripada registry-1.docker.io
env:
  POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15

jobs:
  test:
    name: Test (no Docker Hub)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r dashboard/requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        flake8 dashboard/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 dashboard/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Test PLN Calculator
      run: |
        cd dashboard
        python -c "from pln_calculator import PLNTariffCalculator; calc = PLNTariffCalculator('R1'); result = calc.calculate_bill(1200); assert result.total_bill > 0; print('PLN Calculator test passed')"

    - name: Test PLN tariff settings module
      run: |
        cd dashboard
        python -c "from pln_tariff_settings import _normalize_settings; s=_normalize_settings({'tariff_class':'B2','contracted_va':53000,'ppn_percent':0.11}); assert s['tariff_class']=='B2'; print('PLN settings test passed')"

    - name: Test Report Generator imports
      run: |
        cd dashboard
        python -c "from report_generator import ThreePhaseCalculator, DatabaseManager, ReportGenerator; print('All imports successful')"

  test-db:
    name: Test Database Connection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install psycopg2
      run: pip install psycopg2-binary

    - name: Pull PostgreSQL image (retry + ECR mirror)
      run: |
        IMAGE="${{ env.POSTGRES_IMAGE }}"
        for attempt in 1 2 3 4 5; do
          echo "Pull attempt ${attempt}/5: ${IMAGE}"
          if docker pull "$IMAGE"; then
            echo "Pull succeeded"
            exit 0
          fi
          sleep $((attempt * 15))
        done
        echo "All pull attempts failed"
        exit 1

    - name: Start PostgreSQL container
      run: |
        docker run -d --name pg-ci \
          -e POSTGRES_DB=pzem_monitoring \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=Admin123 \
          -p 5432:5432 \
          --health-cmd "pg_isready -U postgres" \
          --health-interval 5s \
          --health-timeout 5s \
          --health-retries 10 \
          "${{ env.POSTGRES_IMAGE }}"
        for i in $(seq 1 30); do
          if docker exec pg-ci pg_isready -U postgres >/dev/null 2>&1; then
            echo "PostgreSQL ready"
            exit 0
          fi
          sleep 2
        done
        docker logs pg-ci
        exit 1

    - name: Test database connection
      env:
        DB_HOST: localhost
        DB_NAME: pzem_monitoring
        DB_USER: postgres
        DB_PASS: Admin123
      run: |
        python -c "import psycopg2; conn = psycopg2.connect(host='localhost', database='pzem_monitoring', user='postgres', password='Admin123'); print('Database connection successful')"

    - name: Stop PostgreSQL container
      if: always()
      run: docker rm -f pg-ci 2>/dev/null || true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, test-db]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build dashboard image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./dashboard/Dockerfile
        push: false
        tags: pzem-dashboard:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build MQTT listener image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./mqtt/Dockerfile
        push: false
        tags: pzem-mqtt:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test docker-compose config
      run: docker compose config

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
