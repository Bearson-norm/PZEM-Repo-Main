name: CD - Deploy to Production VPS

on:
  # Trigger setelah CI workflow berhasil (hanya untuk main/master)
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches: [ main, master ]
  # Manual trigger tetap tersedia
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_ci_check:
        description: 'Skip CI check (for emergency deployment)'
        required: false
        default: false
        type: boolean

env:
  VPS_USER: foom
  VPS_HOST: ${{ secrets.VPS_HOST || '103.31.39.189' }}
  VPS_DEPLOY_DIR: /opt/pzem-monitoring
  PROJECT_DIR: pzem-monitoring/V9-Docker

jobs:
  check-ci-status:
    name: Verify CI Status
    runs-on: ubuntu-latest
    if: always()
    outputs:
      ci_success: ${{ steps.check.outputs.success }}
      commit_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    
    steps:
    - name: Check CI workflow result
      id: check
      run: |
        if [ "${{ github.event_name }}" == "workflow_run" ]; then
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ CI workflow did not succeed. Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ CI workflow completed successfully"
          echo "success=true" >> $GITHUB_OUTPUT
        else
          # Manual dispatch - skip CI check if requested
          if [ "${{ github.event.inputs.skip_ci_check }}" == "true" ]; then
            echo "⚠️  Skipping CI check (manual deployment with skip_ci_check=true)"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  Manual deployment - CI check skipped"
            echo "success=true" >> $GITHUB_OUTPUT
          fi
        fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [check-ci-status]
    if: |
      (github.event_name == 'workflow_run' && needs.check-ci-status.outputs.ci_success == 'true') ||
      (github.event_name == 'workflow_dispatch' && needs.check-ci-status.outputs.ci_success == 'true')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && needs.check-ci-status.outputs.commit_sha || github.sha }}

    - name: Setup SSH
      run: |
        set +e  # Don't fail on errors in this step
        
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Write private key to file (preserve newlines)
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Verify key file was created
        if [ ! -f ~/.ssh/deploy_key ]; then
          echo "❌ Error: Failed to create deploy_key file"
          exit 1
        fi
        
        # Check key format
        if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
          echo "⚠️  Warning: Key format may be incorrect (missing BEGIN line)"
        fi
        
        # Add VPS to known hosts
        ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        chmod 600 ~/.ssh/known_hosts
        
        # Quick SSH connection test
        echo "🔍 Testing SSH connection..."
        if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 -o BatchMode=yes ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo 'SSH OK'" > /dev/null 2>&1; then
          echo "✅ SSH connection OK"
        else
          echo "❌ SSH connection failed - check VPS_SSH_KEY secret"
          exit 1
        fi
        
        set -e  # Re-enable error checking

    - name: Create deployment package
      run: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        PACKAGE_NAME="pzem-monitoring-deploy-${TIMESTAMP}.tar.gz"
        
        # Create package from V9-Docker directory
        # Note: --exclude options must come before files/directories
        cd ${PROJECT_DIR}
        
        # Build list of files to include
        FILES_TO_INCLUDE="dashboard/ mqtt/ docker-compose.yml"
        
        # Add important files if they exist
        [ -f "start.sh" ] && FILES_TO_INCLUDE="$FILES_TO_INCLUDE start.sh"
        [ -f "nginx-pzem.conf" ] && FILES_TO_INCLUDE="$FILES_TO_INCLUDE nginx-pzem.conf"
        [ -f "setup-nginx-ssl.sh" ] && FILES_TO_INCLUDE="$FILES_TO_INCLUDE setup-nginx-ssl.sh"
        
        # Add markdown files if any exist (for documentation)
        if ls *.md 1> /dev/null 2>&1; then
          FILES_TO_INCLUDE="$FILES_TO_INCLUDE *.md"
        fi
        
        echo "📦 Files to include in package:"
        echo "$FILES_TO_INCLUDE"
        
        # Quick verification dashboard.html exists
        if [ ! -f "dashboard/templates/dashboard.html" ]; then
          echo "❌ ERROR: dashboard.html not found!"
          exit 1
        fi
        echo "✅ dashboard.html verified"
        
        # Create tar archive with excludes before files
        tar -czf ../../${PACKAGE_NAME} \
          --exclude='*.pyc' \
          --exclude='__pycache__' \
          --exclude='*.log' \
          --exclude='*.pdf' \
          --exclude='*.zip' \
          --exclude='*.tar.gz' \
          --exclude='.git' \
          $FILES_TO_INCLUDE
        
        # Quick package verification
        PACKAGE_SIZE=$(wc -c < ../../${PACKAGE_NAME})
        if [ "$PACKAGE_SIZE" -lt 10000 ] || ! tar -tzf ../../${PACKAGE_NAME} | grep -q "dashboard/templates/dashboard.html"; then
          echo "❌ Package verification failed!"
          exit 1
        fi
        echo "✅ Package verified: ${PACKAGE_NAME} ($(echo $PACKAGE_SIZE | awk '{printf "%.1f KB", $1/1024}'))"
        
        cd ../..
        echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
        echo "✅ Package created and verified: ${PACKAGE_NAME}"

    - name: Upload package to VPS
      run: |
        # Optimized upload with single retry
        if ! scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${PACKAGE_NAME} ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/ 2>&1; then
          echo "⚠️  First upload attempt failed, retrying once..."
          sleep 5
          if ! scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${PACKAGE_NAME} ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/ 2>&1; then
            echo "❌ Upload failed after retry"
            exit 1
          fi
        fi
        echo "✅ Package uploaded to VPS"

    - name: Create remote deployment script
      run: |
        cat > /tmp/remote-deploy.sh << 'REMOTE_SCRIPT'
        #!/bin/bash
        set -e
        
        VPS_DEPLOY_DIR="/opt/pzem-monitoring"
        # Use home directory for backups (user has permission there)
        BACKUP_DIR="${HOME}/.pzem-backups"
        PACKAGE_FILE=$(ls /tmp/pzem-monitoring-deploy-*.tar.gz | head -1)
        
        # Detect docker-compose
        if command -v docker-compose &> /dev/null; then
          DOCKER_COMPOSE="docker-compose"
        elif docker compose version &> /dev/null; then
          DOCKER_COMPOSE="docker compose"
        else
          echo "❌ ERROR: docker-compose not found"
          exit 1
        fi
        
        echo "🔧 Starting deployment to ${VPS_DEPLOY_DIR}..."
        
        # Backup existing (if exists)
        if [ -d "${VPS_DEPLOY_DIR}" ]; then
          echo "📦 Creating backup..."
          # Create backup directory (use home directory to avoid permission issues)
          mkdir -p "${BACKUP_DIR}" || {
            echo "⚠️  Warning: Cannot create backup directory ${BACKUP_DIR}, trying alternative location..."
            BACKUP_DIR="${VPS_DEPLOY_DIR}/.backups"
            mkdir -p "${BACKUP_DIR}" || {
              echo "⚠️  Warning: Cannot create backup directory, skipping backup..."
              BACKUP_DIR=""
            }
          }
          
          if [ -f "${VPS_DEPLOY_DIR}/docker-compose.yml" ]; then
            cd "${VPS_DEPLOY_DIR}"
            
            # Backup database if container running and backup directory exists
            if [ -n "${BACKUP_DIR}" ] && docker ps | grep -q "pzem-monitoring.*db\|.*db.*pzem"; then
              DB_CONTAINER=$(docker ps | grep -E "pzem-monitoring.*db|.*db.*pzem" | awk '{print $1}' | head -1)
              if [ -n "$DB_CONTAINER" ]; then
                echo "💾 Backing up database..."
                docker exec ${DB_CONTAINER} pg_dump -U postgres pzem_monitoring > "${BACKUP_DIR}/database_backup_$(date +%Y%m%d_%H%M%S).sql" 2>/dev/null || echo "⚠️  Database backup failed (non-critical)"
                echo "✅ Database backup completed"
              fi
            fi
            
            # Backup .env if backup directory exists
            if [ -n "${BACKUP_DIR}" ] && [ -f "${VPS_DEPLOY_DIR}/.env" ]; then
              cp "${VPS_DEPLOY_DIR}/.env" "${BACKUP_DIR}/.env.backup.$(date +%Y%m%d_%H%M%S)" || echo "⚠️  .env backup failed (non-critical)"
              echo "✅ .env backed up"
            fi
            
            # Stop services quickly
            echo "🛑 Stopping services..."
            $DOCKER_COMPOSE down 2>/dev/null || true
            sleep 3  # Reduced wait time
            echo "✅ Services stopped"
          fi
          
          # Backup directory
          BACKUP_NAME="${VPS_DEPLOY_DIR}_backup_$(date +%Y%m%d_%H%M%S)"
          echo "📦 Backing up directory to ${BACKUP_NAME}..."
          mv "${VPS_DEPLOY_DIR}" "${BACKUP_NAME}" || true
        fi
        
        # Extract new package
        echo "📦 Extracting package..."
        mkdir -p "${VPS_DEPLOY_DIR}"
        cd "${VPS_DEPLOY_DIR}"
        tar -xzf "${PACKAGE_FILE}"
        
        # Quick file verification
        if [ ! -f "${VPS_DEPLOY_DIR}/dashboard/templates/dashboard.html" ] || [ "$(wc -c < "${VPS_DEPLOY_DIR}/dashboard/templates/dashboard.html")" -lt 1000 ]; then
          echo "❌ ERROR: dashboard.html missing or invalid!"
          exit 1
        fi
        echo "✅ Files extracted and verified"
        
        # Restore .env if exists and backup directory is available
        if [ -n "${BACKUP_DIR}" ] && [ -f "${BACKUP_DIR}/.env.backup."* ] 2>/dev/null; then
          LATEST_ENV=$(ls -t "${BACKUP_DIR}/.env.backup."* 2>/dev/null | head -1)
          if [ -n "${LATEST_ENV}" ] && [ -f "${LATEST_ENV}" ]; then
            cp "${LATEST_ENV}" "${VPS_DEPLOY_DIR}/.env"
            echo "✅ .env restored from backup"
          else
            echo "⚠️  No .env backup found - using default configuration"
          fi
        else
          echo "⚠️  No .env backup found - using default configuration"
        fi
        
        # Make scripts executable
        chmod +x ${VPS_DEPLOY_DIR}/*.sh 2>/dev/null || true
        
        # Ensure dashboard template files have correct permissions
        echo "🔧 Setting correct permissions for dashboard files..."
        chmod -R 644 ${VPS_DEPLOY_DIR}/dashboard/templates/*.html 2>/dev/null || true
        chmod 755 ${VPS_DEPLOY_DIR}/dashboard/templates 2>/dev/null || true
        echo "✅ Permissions set"
        
        # Build without cache to ensure latest code is deployed
        echo "🔨 Building containers (no cache - ensures code changes are applied)..."
        cd "${VPS_DEPLOY_DIR}"
        
        if ! $DOCKER_COMPOSE build --no-cache 2>&1; then
          echo "❌ Build failed"
          exit 1
        fi
        echo "✅ Build successful"
        
        echo "🚀 Starting services (force recreate to pick up new code)..."
        $DOCKER_COMPOSE up -d --force-recreate
        
        # Wait for services (reduced wait time)
        echo "⏳ Waiting for services to start..."
        sleep 10
        
        # Quick database and health check
        echo "🔍 Verifying services..."
        for i in {1..15}; do
          if $DOCKER_COMPOSE exec -T db pg_isready -U postgres > /dev/null 2>&1; then
            echo "✅ Database ready"
            break
          fi
          sleep 2
        done
        
        # Quick health check
        sleep 5
        if curl -f -s http://localhost:5000/health > /dev/null 2>&1 || curl -f -s http://localhost:5000/ > /dev/null 2>&1; then
          echo "✅ Health check passed"
        else
          echo "⚠️  Health check pending (service may still be starting)"
        fi
        
        # Cleanup
        rm -f "${PACKAGE_FILE}"
        
        echo "✅ Deployment completed successfully!"
        echo "📍 Location: ${VPS_DEPLOY_DIR}"
        REMOTE_SCRIPT
        
        # Upload deployment script (single attempt, retry handled in execute step)
        if ! scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 /tmp/remote-deploy.sh ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/ 2>&1; then
          echo "❌ Failed to upload deployment script"
          exit 1
        fi
        echo "✅ Deployment script uploaded"

    - name: Execute deployment on VPS
      run: |
        # Execute deployment (single attempt - retry logic is in script)
        if ! ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "chmod +x /tmp/remote-deploy.sh && bash /tmp/remote-deploy.sh" 2>&1; then
          echo "❌ Deployment failed"
          exit 1
        fi
        echo "✅ Deployment executed successfully"

    - name: Verify deployment
      run: |
        # Quick verification
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'EOF' || echo "⚠️  Verification incomplete (non-critical)"
        cd ${{ env.VPS_DEPLOY_DIR }}
        echo "📊 Service Status:"
        if command -v docker-compose &> /dev/null; then
          docker-compose ps
        elif docker compose version &> /dev/null; then
          docker compose ps
        fi
        echo ""
        echo "🐳 Running containers:"
        docker ps --filter "name=pzem" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
        EOF

    - name: Cleanup local files
      if: always()
      run: |
        rm -f ${PACKAGE_NAME}
        rm -f /tmp/remote-deploy.sh
        rm -f ~/.ssh/deploy_key

    - name: Deployment summary
      if: always()
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **VPS**: ${{ env.VPS_USER }}@${{ env.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deploy Path**: ${{ env.VPS_DEPLOY_DIR }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Access URLs" >> $GITHUB_STEP_SUMMARY
        echo "- Dashboard: http://${{ env.VPS_HOST }}:5000" >> $GITHUB_STEP_SUMMARY
        echo "- Health: http://${{ env.VPS_HOST }}:5000/health" >> $GITHUB_STEP_SUMMARY
